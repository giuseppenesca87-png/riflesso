# Riflesso — il rimbalzo (coturn). MODELLO: questo file non si lancia così com'è.
#
# È la sponda che serve quando la strada diretta fra telefono e Mac non c'è:
# dal 5G l'operatore assegna al telefono una porta diversa per ogni
# destinazione (NAT simmetrico, misurato il 04/09/2026), e senza una sponda i
# due non si trovano. coturn sposta pacchetti già sigillati: la chiave sta
# solo nel telefono e nel Mac (webapp/net.js:410 ricontrolla l'impronta DTLS
# dentro la busta autenticata), quindi la sponda li porta e non li apre.
#
# Le righe con i segnaposto IPV4 e IPV6 (due trattini bassi ai lati) le
# riempie `installa.sh` leggendo gli indirizzi della macchina, e scrive il risultato in
# `turnserver.local.conf` (non versionato). Non si scrivono qui perché chi si
# copia un file con dentro l'indirizzo di un altro protegge quella macchina e
# lascia scoperta la propria. Misurato: coturn 4.17.2 con un segnaposto al
# posto di un indirizzo si RIFIUTA di partire («Aborting: invalid
# denied-peer-ip value»), quindi il modello non può finire in produzione per
# sbaglio.
#
# Il segreto NON sta qui: arriva dalla riga di comando (`docker-compose.yml`
# lo legge dal file `.env`, che non si versiona). Così questo file resta
# copiabile e il segreto sta in un posto solo.

# ---- dove parla: SOLO l'indirizzo pubblico IPv4 della macchina ----
# Senza queste tre righe coturn si mette in ascolto su ogni indirizzo che
# trova, compresi i ponti interni di Docker: diventerebbe raggiungibile da
# dentro gli altri container della stessa macchina e annuncerebbe agli
# sconosciuti la mappa della rete interna. Nessun IPv6: la macchina ne ha uno
# pubblico, e un coturn che lo prendesse potrebbe essere puntato contro la
# macchina stessa.
listening-ip=__IPV4__
relay-ip=__IPV4__
external-ip=__IPV4__
listening-port=3478

# ---- le porte dei rimbalzi: 201 porte, cioè al massimo 201 sessioni ----
min-port=49200
max-port=49400

# ---- niente TLS, niente DTLS: niente 5349, niente certificati, niente root ----
# La 5349 avrebbe voluto il magazzino dei certificati di Caddy, che contiene
# le chiavi private di quattro progetti ed è leggibile solo da root. Chi sta su
# una rete che vuole vedere del TLS resta senza rimbalzo: è un buco dichiarato.
no-tls
no-dtls

# (Il mandato chiede anche `no-cli` e `no-loopback-peers`. In coturn 4.17.2
# sono il comportamento predefinito e le due righe producono solo un avviso
# all'avvio — misurato: «no-cli option is deprecated» e «Bad configuration
# format: no-loopback-peers». La console resta spenta e il loopback resta
# negato: si ottiene la stessa cosa senza sporcare il registro, e il loopback
# è comunque negato esplicitamente più sotto con `denied-peer-ip`.)

# ---- integrità e credenziali ----
# `fingerprint`: ogni messaggio porta l'impronta CRC, come vuole WebRTC.
# `use-auth-secret`: credenziali a scadenza (TURN REST): il ponte conia un
# nome `<scadenza>:<8 caratteri casuali>` e una password HMAC del segreto,
# e coturn le verifica senza database. Gli otto caratteri contano: la quota si
# conta per nome utente, e senza di essi due telefoni nello stesso secondo si
# dividerebbero una quota sola.
fingerprint
use-auth-secret
realm=riflesso

# ---- le quote ----
# Per nome utente (una credenziale = un telefono per dieci minuti): 12.
# In totale: 100. La quota totale è anche un modo per chiudere fuori chi la
# sponda l'ha messa: la porta d'ingresso sul ponte (credenziale solo per una
# stanza viva) è ciò che rende difficile riempirla, la quota alta è ciò che la
# rende sopportabile.
user-quota=12
total-quota=100

# ---- il freno ----
# 250 kB/s per sessione: una conversazione pesante passa in un terzo di
# secondo, una foto da 3 MB in 12. Misurato senza tetto: 335 Mbit/s; con il
# tetto: 1,8 — un freno da 190 volte, che rende la sponda inutile a chi
# volesse abusarne. Tetto complessivo della macchina: 20 MB/s.
max-bps=250000
bps-capacity=20000000

# Il nonce vive 10 minuti: una credenziale rubata a metà non si riusa dopo.
stale-nonce=600

# ---- il recinto: dove i rimbalzi NON possono andare ----
# Un permesso verso questi indirizzi riceve «403 Forbidden». Servono perché la
# sponda sta sulla stessa macchina di altri progetti con dati di clienti: senza
# questo elenco chi ha una credenziale potrebbe farsi rimbalzare verso i loro
# database attraverso i ponti interni di Docker (172.17.x, 172.18.x…).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Le DUE righe della macchina stessa — le scrive l'installatore, non il
# repository. Sono quelle che chiudono il buco peggiore del dossier: un
# rimbalzo puntato contro la macchina stessa (ssh sulla 22, e fail2ban che
# bandisce la VPS a sé stessa).
denied-peer-ip=__IPV4__
denied-peer-ip=__IPV6__

# ---- superficie in meno ----
# I browser non usano i rimbalzi TCP verso il peer (RFC 6062): spenti.
no-tcp-relay

# ---- registro e file di lavoro, per un container in sola lettura ----
# Tutto sul registro del container (docker logs), niente file ruotati.
# Il pid e il database (che con `use-auth-secret` resta vuoto, ma coturn lo
# apre comunque) stanno in memoria: `docker-compose.yml` monta /tmp e
# /var/lib/coturn come tmpfs.
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
